<section id="__ROOT_ID__">
  <header class="recap-heading"><h3 data-topic></h3><span class="text-small" data-topic-tier></span></header>
  <div class="recap-tree" aria-label="考点树">
    <div class="recap-origin">
      <span class="text-small" data-entry-label></span>
      <p data-entry></p>
    </div>
    <div class="recap-branches" data-branches role="group" aria-label="可展开的考点"></div>
  </div>
  <section class="recap-detail" id="__ROOT_ID__-detail" data-detail aria-live="polite" hidden>
    <h4 data-point></h4>
    <p class="text-small" data-counts></p>
    <div data-schematic></div>
    <div data-exam>
      <h4>考场记忆</h4>
      <p data-cue></p>
      <p data-action></p>
    </div>
    <div data-knowledge>
      <h4>知识点记忆</h4>
      <p data-rule></p>
    </div>
  </section>
  <p class="text-small recap-frequency">考频按历年主考次数分档，同一父题按考点去重。</p>
</section>
<style>
#__ROOT_ID__ { --recap-gap: var(--font-size-base, 14px); color: var(--foreground); overflow-wrap: anywhere; }
#__ROOT_ID__ [hidden] { display: none !important; }
#__ROOT_ID__ .recap-heading { display: flex; align-items: baseline; flex-wrap: wrap; gap: calc(var(--recap-gap) * .55); }
#__ROOT_ID__ [data-topic-tier] { color: var(--muted-foreground); }
#__ROOT_ID__ .recap-tree { display: grid; grid-template-columns: minmax(7rem, 24%) minmax(0, 1fr); align-items: center; gap: calc(var(--recap-gap) * 2); margin-block: var(--recap-gap); }
#__ROOT_ID__ .recap-origin { position: relative; box-sizing: border-box; max-width: 100%; padding: calc(var(--recap-gap) * .6); border: 1px solid var(--border); }
#__ROOT_ID__ .recap-origin::after { content: ""; position: absolute; left: 100%; top: 50%; width: var(--recap-gap); border-top: 1px solid var(--border); }
#__ROOT_ID__ .recap-origin p { margin: 0; }
#__ROOT_ID__ .recap-origin span, #__ROOT_ID__ .recap-frequency, #__ROOT_ID__ [data-counts] { color: var(--muted-foreground); }
#__ROOT_ID__ .recap-branches { min-width: 0; }
#__ROOT_ID__ .recap-branch { position: relative; display: flex; padding-block: calc(var(--recap-gap) * .22); }
#__ROOT_ID__ .recap-branch::before { content: ""; position: absolute; left: calc(-1 * var(--recap-gap)); top: 50%; width: var(--recap-gap); border-top: 1px solid var(--border); }
#__ROOT_ID__ .recap-branch::after { content: ""; position: absolute; left: calc(-1 * var(--recap-gap)); top: 0; bottom: 0; border-left: 1px solid var(--border); }
#__ROOT_ID__ .recap-branch:first-child::after { top: 50%; }
#__ROOT_ID__ .recap-branch:last-child::after { bottom: 50%; }
#__ROOT_ID__ .recap-node { width: 100%; min-width: 0; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; justify-items: start; gap: 0 calc(var(--recap-gap) * .5); white-space: normal; text-align: start; }
#__ROOT_ID__ .recap-summary { grid-column: 1 / -1; }
#__ROOT_ID__ .recap-node[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }
#__ROOT_ID__ .recap-node[data-tier="高频"][aria-pressed="false"] .recap-tier { color: var(--viz-series-1, var(--foreground)); }
#__ROOT_ID__ .recap-detail { border-top: 1px solid var(--border); padding-top: var(--recap-gap); }
#__ROOT_ID__ .recap-detail > div { margin-top: var(--recap-gap); }
#__ROOT_ID__ .recap-detail p { margin-block: calc(var(--recap-gap) * .3); }
#__ROOT_ID__ .recap-schematic { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--recap-gap) * .45); }
#__ROOT_ID__ .recap-stage { display: grid; gap: 2px; }
#__ROOT_ID__ .recap-step { padding: calc(var(--recap-gap) * .3) calc(var(--recap-gap) * .55); border: 1px solid var(--border); }
#__ROOT_ID__ .recap-stage[data-overlap] .recap-step { border-inline-start: 3px solid var(--viz-series-1, var(--foreground)); }
#__ROOT_ID__ .mechanism-svg { display: block; max-width: 100%; height: auto; }
#__ROOT_ID__ .mechanism-svg text { fill: var(--foreground); font: inherit; }
#__ROOT_ID__ .mechanism-svg .mechanism-small { font-size: .86em; }
#__ROOT_ID__ .mechanism-svg .mechanism-fields { font-family: ui-monospace, monospace; font-size: .88em; }
#__ROOT_ID__ .mechanism-line { fill: none; stroke: var(--viz-series-1, var(--foreground)); stroke-width: 1.45; }
#__ROOT_ID__ .mechanism-line[data-current-step] { stroke-width: 2.5; }
#__ROOT_ID__ .mechanism-fields [data-field-emphasis] { fill: var(--viz-series-1, var(--foreground)); font-weight: 600; }
#__ROOT_ID__ [data-lifeline], #__ROOT_ID__ [data-time-axis] { stroke: var(--muted-foreground); }
#__ROOT_ID__ .mechanism-arrowhead { fill: var(--viz-series-1, var(--foreground)); }
#__ROOT_ID__ .mechanism-box { fill: var(--background); stroke: var(--border); }
#__ROOT_ID__ .mechanism-offset, #__ROOT_ID__ .mechanism-table[data-kind="lanes"] td:not([data-idle]) {
  background: color-mix(in srgb,var(--viz-series-1) 10%,var(--background));
  fill: color-mix(in srgb,var(--viz-series-1) 10%,var(--background));
}
#__ROOT_ID__ .mechanism-edge-label { paint-order: stroke; stroke: var(--background); stroke-width: 3px; }
#__ROOT_ID__ .mechanism-flow { display: flex; flex-wrap: wrap; align-items: center; gap: .4em; }
#__ROOT_ID__ .mechanism-transition { display: inline-flex; align-items: center; gap: .4em; }
#__ROOT_ID__ .mechanism-stage, #__ROOT_ID__ .mechanism-cell { padding: .28em .52em; border: 1px solid var(--border); }
#__ROOT_ID__ .mechanism-band-frame { display: inline-flex; max-width: 100%; flex-direction: column; border: 1px solid var(--border); }
#__ROOT_ID__ .mechanism-band { display: flex; flex-wrap: wrap; }
#__ROOT_ID__ .mechanism-band + .mechanism-band { border-top: 1px solid var(--border); }
#__ROOT_ID__ .mechanism-band-frame .mechanism-cell { border: 0; }
#__ROOT_ID__ .mechanism-band-frame .mechanism-cell + .mechanism-cell { border-inline-start: 1px solid var(--border); }
#__ROOT_ID__ .mechanism-partition { display: inline-flex; flex-direction: row; flex-wrap: wrap; }
#__ROOT_ID__ .mechanism-bitfigure { --offset-gutter: 2.55em; margin: 0; min-width: 0; }
#__ROOT_ID__ .mechanism-bitfigure figcaption { margin-bottom: .28em; }
#__ROOT_ID__ .mechanism-ruler, #__ROOT_ID__ .mechanism-bitrow {
  display: grid; grid-template-columns: var(--offset-gutter) minmax(0,1fr); min-width: 0;
}
#__ROOT_ID__ .mechanism-ruler { margin-inline-end: 1em; }
#__ROOT_ID__ .mechanism-bit-scale { position: relative; min-height: 1.35em; }
#__ROOT_ID__ .mechanism-tick { position: absolute; transform: translateX(-50%); color: var(--muted-foreground); font-size: .84em; }
#__ROOT_ID__ .mechanism-tick[data-edge="first"] { transform: none; }
#__ROOT_ID__ .mechanism-tick[data-edge="last"] { transform: translateX(-84%); }
#__ROOT_ID__ .mechanism-byte { padding-inline: .22em; align-self: center; color: var(--muted-foreground); font-size: .84em; }
#__ROOT_ID__ .mechanism-packet { position: relative; border: 1px solid var(--border); margin-inline-end: 1em; }
#__ROOT_ID__ .mechanism-fixed { position: relative; }
#__ROOT_ID__ .mechanism-brace { position: absolute; inset-block: 0; left: 100%; width: .85em; height: 100%; pointer-events: none; }
#__ROOT_ID__ .mechanism-bitrow + .mechanism-bitrow { border-top: 1px solid var(--border); }
#__ROOT_ID__ .mechanism-fields-grid { display: grid; min-width: 0; border-inline-start: 1px solid var(--border); }
#__ROOT_ID__ .mechanism-fields-grid[data-word-count] {
  background: repeating-linear-gradient(to bottom, transparent 0 calc(1.7em - 1px), var(--border) calc(1.7em - 1px) 1.7em);
}
#__ROOT_ID__ .mechanism-field {
  font: inherit; min-width: 0; min-height: 2.45em; padding: .12em .1em; color: var(--foreground);
  background: transparent; border: 0; text-align: center; cursor: pointer; overflow-wrap: anywhere;
}
#__ROOT_ID__ .mechanism-field + .mechanism-field { border-inline-start: 1px solid var(--border); }
#__ROOT_ID__ .mechanism-field[data-focus], #__ROOT_ID__ .mechanism-field[aria-pressed="true"] {
  background: color-mix(in srgb,var(--viz-series-1) 12%,var(--background));
}
#__ROOT_ID__ .mechanism-field:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
#__ROOT_ID__ .mechanism-field-label, #__ROOT_ID__ .mechanism-field-bits { display: block; }
#__ROOT_ID__ .mechanism-field-bits { font-size: .84em; }
#__ROOT_ID__ .mechanism-field-dot { display: inline-block; width: .25em; height: .25em; border-radius: 50%; background: var(--viz-series-1); }
#__ROOT_ID__ .mechanism-packet-tail { display: flex; flex-wrap: wrap; gap: .1em .6em; padding: .3em .45em .3em var(--offset-gutter); border-top: 1px dashed var(--border); }
#__ROOT_ID__ .mechanism-tail-width { color: var(--muted-foreground); font-size: .86em; }
#__ROOT_ID__ .mechanism-flag-ruler { display: flex; flex-wrap: wrap; margin-top: .45em; }
#__ROOT_ID__ .mechanism-flag { padding: .15em .4em; border: 1px solid var(--border); font-size: .84em; }
#__ROOT_ID__ button.mechanism-flag { font-family: inherit; color: var(--foreground); background: var(--background); cursor: pointer; }
#__ROOT_ID__ .mechanism-flag[data-focus], #__ROOT_ID__ .mechanism-flag[aria-pressed="true"] { background: color-mix(in srgb,var(--viz-series-1) 12%,var(--background)); }
#__ROOT_ID__ .mechanism-flag + .mechanism-flag { border-inline-start: 0; }
#__ROOT_ID__ .mechanism-field-note { display: block; margin-block: .25em; font-size: .86em; color: var(--muted-foreground); }
#__ROOT_ID__ .mechanism-field-detail { min-height: 1.2em; }
#__ROOT_ID__ .mechanism-table { border-collapse: collapse; table-layout: fixed; max-width: 100%; }
#__ROOT_ID__ .mechanism-table th, #__ROOT_ID__ .mechanism-table td { padding: .3em; border: 1px solid var(--border); overflow-wrap: anywhere; }
#__ROOT_ID__ .mechanism-tree { display: flex; align-items: center; gap: 1.5em; }
#__ROOT_ID__ .mechanism-tree ul { list-style: none; padding: 0; margin: 0; border-inline-start: 1px solid var(--border); }
#__ROOT_ID__ .mechanism-tree li { position: relative; padding: .18em 0 .18em 1em; }
#__ROOT_ID__ .mechanism-tree li::before { content:""; position:absolute; left:0; top:50%; width:.75em; border-top:1px solid var(--border); }
#__ROOT_ID__ .recap-frequency { margin-top: var(--recap-gap); }
#__ROOT_ID__ .communication-lesson { display: grid; gap: calc(var(--recap-gap) * .7); }
#__ROOT_ID__ .communication-formula { font-size: 1.1em; font-variant-numeric: tabular-nums; }
#__ROOT_ID__ .datapath-lesson { display: grid; gap: calc(var(--recap-gap) * .7); }
#__ROOT_ID__ .datapath-signals { font-family: ui-monospace, monospace; }
@media (max-width: 490px) {
  #__ROOT_ID__ .recap-tree { display: block; }
  #__ROOT_ID__ .recap-origin { width: fit-content; }
  #__ROOT_ID__ .recap-origin::after { left: calc(var(--recap-gap) - 1px); top: 100%; width: 0; height: calc(var(--recap-gap) * .55); border: 0; border-left: 1px solid var(--border); }
  #__ROOT_ID__ .recap-branches { padding-top: calc(var(--recap-gap) * .5); margin-left: var(--recap-gap); }
  #__ROOT_ID__ .recap-branch { padding: calc(var(--recap-gap) * .25) 0 calc(var(--recap-gap) * .25) var(--recap-gap); }
  #__ROOT_ID__ .recap-branch::before, #__ROOT_ID__ .recap-branch::after { left: 0; }
  #__ROOT_ID__ .recap-branch:first-child::after { top: 0; }
}
</style>
<script type="application/json" id="__ROOT_ID__-data">__REVIEW_DATA__</script>
<script>
(() => {
  const root = document.getElementById('__ROOT_ID__');
  const data = JSON.parse(document.getElementById(root.id + '-data').textContent);
  const find = field => root.querySelector('[data-' + field + ']');
  const branches = find('branches');
  const buttons = [];
  find('topic').textContent = data.title;
  find('topic-tier').textContent = '专题 · ' + data.topic_tier;
  find('entry-label').textContent = data.from_question ? '本题切入' : '专题切入';
  find('entry').textContent = data.entry;
  let selected = null;

  __MECHANISM_RUNTIME__

  function draw(node) {
    const panel = find('schematic');
    panel.replaceChildren();
    if (node?.mechanism) {
      panel.hidden=false;
      renderMechanism(panel,node.mechanism,root.id+'-arrow');
      return;
    }
    const visual=node?.visual;
    panel.hidden = !visual;
    if (!visual) return;
    const row = document.createElement('div');
    row.className = 'recap-schematic';
    for (const [index, item] of visual.items.entries()) {
      if (index && visual.kind === 'flow') {
        const arrow = document.createElement('span');
        arrow.textContent = '→';
        arrow.setAttribute('aria-hidden','true');
        row.append(arrow);
      }
      const stage = document.createElement('div');
      stage.className = 'recap-stage';
      if (Array.isArray(item)) stage.dataset.overlap = '';
      for (const label of Array.isArray(item) ? item : [item]) {
        const step = document.createElement('span');
        step.className = 'recap-step';
        step.textContent = label;
        stage.append(step);
      }
      row.append(stage);
    }
    panel.append(row);
  }

  function select(node) {
    selected = node?.id ?? null;
    for (const button of buttons) {
      const active = String(button.dataset.pointId === selected);
      button.setAttribute('aria-pressed',active);
      button.setAttribute('aria-expanded',active);
    }
    find('detail').hidden = !node;
    if (!node) {
      draw(null);
      return;
    }
    find('point').textContent = node.label;
    find('counts').textContent = node.main_count === null ? '' :
      '主考 ' + node.main_count + ' 次 · 兼考 ' + (node.secondary_count ?? 0) + ' 次';
    const cue = node.cue === data.entry ? '' : node.cue;
    find('cue').textContent = cue;
    find('action').textContent = node.action;
    find('rule').textContent = node.rule;
    find('exam').hidden = !cue && !node.action;
    find('knowledge').hidden = !node.rule;
    draw(node);
  }

  function restore(widgetState) {
    const saved = widgetState?.privateContent;
    if (saved?.map === root.id) select(data.nodes.find(item => item.id === saved.point));
  }

  for (const node of data.nodes) {
    const branch = document.createElement('div');
    branch.className = 'recap-branch';
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'btn recap-node';
    button.dataset.pointId = node.id;
    button.dataset.tier = node.tier;
    button.setAttribute('aria-controls', root.id + '-detail');
    button.setAttribute('aria-label', node.title + '，' + node.tier);
    const label = document.createElement('span');
    label.textContent = node.label;
    const tier = document.createElement('span');
    tier.className = 'recap-tier text-small';
    tier.textContent = node.tier + (node.current && data.from_question ? ' · 本题' : '');
    const summary = document.createElement('span');
    summary.className = 'recap-summary text-small';
    summary.textContent = node.summary;
    button.append(label,tier,summary);
    button.addEventListener('click', () => {
      select(selected === node.id ? null : node);
      window.openai?.setWidgetState?.({privateContent:{map:root.id, point:selected}})?.catch(() => {});
    });
    buttons.push(button);
    branch.append(button);
    branches.append(branch);
  }
  select(null);
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', event => restore(event.detail?.globals?.widgetState));
  let previousWidth=0;
  new ResizeObserver(([entry])=>{
    const width=Math.round(entry.contentRect.width);
    if (width>0 && width!==previousWidth) {
      previousWidth=width;
      const node=data.nodes.find(item=>item.id===selected);
      if (['graph','sequence','address'].includes(node?.mechanism?.kind)) draw(node);
    }
  }).observe(root);
})();
</script>
