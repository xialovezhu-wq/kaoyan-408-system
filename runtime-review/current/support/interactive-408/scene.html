<div id="__ROOT_ID__" class="cs408-scene">
  <h3 data-heading></h3>
  <section data-linear aria-label="顺序文字讲解"></section>
  <nav data-overview aria-label="总体流程与对象导航" hidden></nav>
  <div class="viz-controls" data-step-controls hidden>
    <button type="button" class="btn" data-prev aria-label="上一步">上一步</button>
    <span data-step-label aria-live="polite"></span>
    <button type="button" class="btn" data-next aria-label="下一步">下一步</button>
  </div>
  <p data-step-note aria-live="polite" hidden></p>
  <div data-source-diagrams aria-label="真题原图与可点击区域" hidden></div>
  <div data-diagram aria-label="可点击的机制对象"></div>
  <div data-detail aria-live="polite" hidden></div>
  <details data-object-index hidden><summary>对象目录（也可从这里展开图中说明）</summary><div data-object-buttons></div></details>
  <div class="text-small" data-legend>亮线：本步或所选关系</div>
  <div data-relations aria-label="对象间的关系"></div>
</div>
<style>
#__ROOT_ID__ { --scene-ink:var(--foreground); --scene-accent:var(--viz-series-1); --scene-soft:color-mix(in srgb,var(--viz-series-1) 10%,transparent); --scene-line:var(--border); color:var(--foreground); }
#__ROOT_ID__ [data-linear] p { white-space:pre-wrap; line-height:1.7; max-width:68ch; }
#__ROOT_ID__ [data-linear] section { margin:20px 0; padding-left:12px; border-left:2px solid var(--border); }
#__ROOT_ID__ [hidden] { display:none !important; }
#__ROOT_ID__ [data-overview], #__ROOT_ID__ [data-object-buttons] { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
#__ROOT_ID__ [data-overview] { padding-bottom:12px; border-bottom:1px solid var(--border,var(--scene-line)); }
#__ROOT_ID__ button:focus-visible, #__ROOT_ID__ summary:focus-visible { outline:3px solid var(--viz-series-1,var(--scene-accent)); outline-offset:3px; }
#__ROOT_ID__ .node-control[aria-pressed="true"] { outline:2px solid var(--viz-series-1,var(--scene-accent)); outline-offset:2px; }
#__ROOT_ID__ .node-control[data-related="true"] { text-decoration:underline; text-decoration-thickness:2px; }
#__ROOT_ID__ .source-figure { margin:18px 0; }
#__ROOT_ID__ [data-step-note] { white-space:pre-line; overflow-wrap:anywhere; line-height:1.65; }
#__ROOT_ID__ .source-surface { position:relative; width:100%; overflow:visible; background:var(--background); }
#__ROOT_ID__ .source-surface img { display:block; width:100%; height:auto; }
#__ROOT_ID__ .source-figure figcaption { margin-top:8px; overflow-wrap:anywhere; }
#__ROOT_ID__ .source-hotspot { position:absolute; box-sizing:border-box; padding:0; margin:0; border:2px dashed var(--viz-series-1); border-radius:3px; background:color-mix(in srgb,var(--viz-series-1) 5%,transparent); color:var(--foreground); }
#__ROOT_ID__ .source-hotspot:hover { background:color-mix(in srgb,var(--viz-series-1) 12%,transparent); }
#__ROOT_ID__ .source-hotspot[aria-pressed="true"] { border:3px solid var(--viz-series-1); background:color-mix(in srgb,var(--viz-series-1) 16%,transparent); outline:2px solid var(--background); outline-offset:0; }
#__ROOT_ID__ .source-hotspot[data-related="true"] { border:3px solid var(--viz-series-2); background:color-mix(in srgb,var(--viz-series-2) 16%,transparent); }
#__ROOT_ID__ .source-hotspot[data-active="true"] { box-shadow:0 0 0 2px var(--viz-series-3) inset; }
#__ROOT_ID__ .source-hotspot:focus-visible { outline:3px solid var(--ring); outline-offset:2px; z-index:2; }
#__ROOT_ID__ .source-label { display:inline-block; padding:1px 3px; color:var(--foreground); background:var(--background); font:inherit; }
#__ROOT_ID__ .sr-only { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
#__ROOT_ID__ [data-diagram] { position:relative; padding:12px 0; }
#__ROOT_ID__ .scene-row { display:grid; grid-template-columns:repeat(var(--columns),minmax(0,1fr)); gap:20px; margin:22px 0; align-items:start; }
#__ROOT_ID__ .scene-node { min-width:0; text-align:center; position:relative; z-index:1; }
#__ROOT_ID__ .scene-node .node-value { display:block; overflow-wrap:anywhere; margin-top:6px; }
#__ROOT_ID__ .scene-node[data-active="true"] .node-value { text-decoration:underline; text-decoration-thickness:2px; }
#__ROOT_ID__ .scene-node[data-related="true"] .relation-mark { display:inline; }
#__ROOT_ID__ .relation-mark { display:none; color:var(--foreground,var(--scene-ink)); }
#__ROOT_ID__ .connector { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
#__ROOT_ID__ .connector path { fill:none; stroke:var(--border,var(--scene-line)); stroke-width:1.5; }
#__ROOT_ID__ .connector path[data-active="true"] { stroke:var(--viz-series-1,var(--scene-accent)); stroke-width:2.5; }
#__ROOT_ID__ .connector polygon { fill:var(--foreground,var(--scene-ink)); }
#__ROOT_ID__ [data-relations] { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
#__ROOT_ID__ [data-detail] { margin:16px 0; padding:14px 16px; border-left:3px solid var(--viz-series-1,var(--scene-accent)); background:var(--scene-soft); overflow-wrap:anywhere; }
#__ROOT_ID__ [data-detail] p { margin:6px 0; white-space:pre-wrap; }
#__ROOT_ID__ [data-object-index] { margin:14px 0; }
@media(max-width:480px) {
  #__ROOT_ID__ .scene-row { grid-template-columns:1fr; gap:28px; }
}
</style>
<script type="application/json" id="__ROOT_ID__-data">__PUBLIC_SCENE__</script>
<script>
(() => {
  const root = document.getElementById('__ROOT_ID__');
  const data = JSON.parse(document.getElementById('__ROOT_ID__-data').textContent);
  const diagram = root.querySelector('[data-diagram]');
  const sources = root.querySelector('[data-source-diagrams]');
  const detail = root.querySelector('[data-detail]');
  const relations = root.querySelector('[data-relations]');
  const overview = root.querySelector('[data-overview]');
  const byId = new Map(data.nodes.map(n => [n.id,n]));
  const elements = new Map();
  const nodeButtons = new Map(data.nodes.map(n => [n.id,[]]));
  const edgeButtons = new Map();
  const sourceDiagrams = data.source_diagrams || [];
  const hasSources = sourceDiagrams.length > 0;
  const showMechanism = !hasSources || data.show_mechanism;
  const stepNote = root.querySelector('[data-step-note]');
  const ns = 'http://www.w3.org/2000/svg';
  let selected = null;
  let selectedEdge = null;
  let step = Math.max(0,data.states.findIndex(s => s.id === data.initial_state));
  root.querySelector('[data-heading]').textContent = data.title;
  detail.id = root.id + '-detail';
  for(const step of data.linear_steps || []) {
    const section=document.createElement('section');section.dataset.linearStep=step.id;
    const title=document.createElement('h4');title.textContent=step.title;section.append(title);
    const body=document.createElement('p');body.textContent=step.text;section.append(body);
    if(step.return_to_reasoning){const back=document.createElement('p');back.textContent=step.return_to_reasoning;section.append(back);}
    if(step.node_ids?.length){
      const button=document.createElement('button');button.type='button';button.className='btn';button.textContent='在图中核对这一步';
      button.addEventListener('click',()=>{
        const index=data.states.findIndex(state=>state.id===step.id);
        if(index>=0) showStep(index);
        selected=step.node_ids[0];selectedEdge=null;update();save();
      });
      section.append(button);
    }
    root.querySelector('[data-linear]').append(section);
  }


  function nodeButton(id,label,extraClass='') {
    const button=document.createElement('button');
    button.type='button'; button.className=(extraClass==='source-hotspot'?'cursor-interaction ':'btn ')+'node-control '+extraClass;
    button.textContent=label; button.dataset.node=id;
    button.setAttribute('aria-controls',detail.id); button.setAttribute('aria-expanded','false');
    button.addEventListener('click',()=>{
      selected=selected===id?null:id; selectedEdge=null; update(); save();
    });
    nodeButtons.get(id).push(button);
    return button;
  }
  for(const item of data.overview || []) overview.append(nodeButton(item.node_id,item.label));
  overview.hidden=!overview.children.length;

  // The source raster stays intact. Only authorized DOM buttons sit over its
  // exact normalized rectangles; all teaching text is real, selectable text.
  for(const source of sourceDiagrams) {
    const figure=document.createElement('figure'); figure.className='source-figure'; figure.dataset.source=source.id;
    const surface=document.createElement('div'); surface.className='source-surface';
    const img=document.createElement('img'); img.src=source.src; img.alt=source.alt;
    img.width=source.width; img.height=source.height; img.decoding='async'; surface.append(img);
    for(const hotspot of source.hotspots) {
      const button=nodeButton(hotspot.node_id,'','source-hotspot');
      button.dataset.hotspot=hotspot.id;
      const label=document.createElement('span'); label.className='sr-only';
      label.textContent='展开：'+byId.get(hotspot.node_id).label; button.append(label);
      if(hotspot.display_label) { const visible=document.createElement('span'); visible.className='source-label'; visible.setAttribute('aria-hidden','true'); visible.textContent=hotspot.display_label; button.append(visible); }
      const [x,y,w,h]=hotspot.rect;
      button.style.left=(x*100)+'%'; button.style.top=(y*100)+'%';
      button.style.width=(w*100)+'%'; button.style.height=(h*100)+'%';
      surface.append(button);
    }
    const caption=document.createElement('figcaption'); caption.className='text-small'; caption.textContent=source.alt;
    figure.append(surface,caption); sources.append(figure);
  }
  sources.hidden=!hasSources;
  relations.hidden=!showMechanism;
  diagram.hidden=!showMechanism;
  root.querySelector('[data-object-index]').hidden=!hasSources;
  if(hasSources) {
    root.append(root.querySelector('[data-linear]'));
    root.querySelector('[data-legend]').textContent='点击图中框选区域展开说明；实线框是所选对象，关联框随选择同步突出。';
    const index=root.querySelector('[data-object-buttons]');
    for(const node of data.nodes) index.append(nodeButton(node.id,node.label,'btn-ghost'));
  }
  const svg = document.createElementNS(ns,'svg');
  svg.classList.add('connector'); svg.setAttribute('aria-hidden','true');
  if(showMechanism) {
    diagram.append(svg);
    for (const row of data.rows) {
      const line = document.createElement('div'); line.className = 'scene-row';
      line.style.setProperty('--columns',String(row.length)); diagram.append(line);
      for (const id of row) {
        const node = byId.get(id);
        const wrap = document.createElement('div'); wrap.className = 'scene-node'; wrap.dataset.node = id;
        const button=nodeButton(id,node.label,'viz-tile');
        const mark = document.createElement('span'); mark.className = 'relation-mark text-small'; mark.textContent = ' · 关联';
        const value = document.createElement('span'); value.className = 'node-value tabular-nums';
        wrap.append(button,mark,value); line.append(wrap); elements.set(id,{wrap,button,value});
      }
    }
  }
  for (const edge of (showMechanism?data.edges:[])) {
    const button = document.createElement('button'); button.type = 'button'; button.className = 'btn btn-ghost';
    button.dataset.edge = edge.id; button.textContent = edge.label;
    button.setAttribute('aria-label',byId.get(edge.from).label + '，' + edge.label + '，' + byId.get(edge.to).label);
    button.setAttribute('aria-controls',detail.id); button.setAttribute('aria-expanded','false');
    button.addEventListener('click',() => { selectedEdge = selectedEdge === edge.id ? null : edge.id; selected = null; update(); save(); });
    relations.append(button); edgeButtons.set(edge.id,button);
  }
  function activeEdges() {
    return new Set(data.edges.filter(e => e.id === selectedEdge || e.from === selected || e.to === selected ||
      (data.states[step]?.active_edges || []).includes(e.id)).map(e => e.id));
  }
  function draw() {
    if(!showMechanism) return; // Connections are drawn only in the mechanism area.
    svg.replaceChildren();
    const base = diagram.getBoundingClientRect();
    svg.setAttribute('viewBox',`0 0 ${Math.max(1,base.width)} ${Math.max(1,base.height)}`);
    const active = activeEdges();
    data.edges.forEach(edge => {
      const a = elements.get(edge.from).wrap.getBoundingClientRect();
      const b = elements.get(edge.to).wrap.getBoundingClientRect();
      const horizontal = Math.abs(a.y-b.y) < 16;
      let x1,y1,x2,y2;
      if (horizontal) {
        const right = a.x < b.x;
        x1=(right?a.right:a.left)-base.x; x2=(right?b.left:b.right)-base.x;
        y1=a.top+elements.get(edge.from).button.getBoundingClientRect().height/2-base.y;
        y2=b.top+elements.get(edge.to).button.getBoundingClientRect().height/2-base.y;
      } else {
        const down = a.y < b.y;
        x1=a.left+a.width/2-base.x; x2=b.left+b.width/2-base.x;
        y1=(down?a.bottom:a.top)-base.y; y2=(down?b.top:b.bottom)-base.y;
      }
      const path=document.createElementNS(ns,'path');
      path.setAttribute('d',`M ${x1} ${y1} L ${x2} ${y2}`); path.dataset.edgeLine=edge.id;
      path.dataset.active=String(active.has(edge.id)); svg.append(path);
      const arrow=document.createElementNS(ns,'polygon');
      const angle=Math.atan2(y2-y1,x2-x1), length=7, half=3;
      const px=x2-length*Math.cos(angle),py=y2-length*Math.sin(angle);
      arrow.setAttribute('points',`${x2},${y2} ${px-half*Math.sin(angle)},${py+half*Math.cos(angle)} ${px+half*Math.sin(angle)},${py-half*Math.cos(angle)}`);
      svg.append(arrow);
    });
  }
  function paragraph(text) {
    const p=document.createElement('p'); p.textContent=text; detail.append(p);
  }
  function update() {
    const state=data.states[step]; const active=activeEdges(); const related=new Set();
    for (const edge of data.edges) if (active.has(edge.id)) { related.add(edge.from); related.add(edge.to); }
    for (const [id,buttons] of nodeButtons) for(const button of buttons) {
      button.setAttribute('aria-expanded',String(selected===id));
      button.setAttribute('aria-pressed',String(selected===id));
      button.dataset.related=String(related.has(id) && selected!==id);
      button.dataset.active=String((state?.active_nodes || []).includes(id));
    }
    for (const [id,el] of elements) {
      el.wrap.dataset.related=String(related.has(id));
      el.wrap.dataset.active=String((state?.active_nodes || []).includes(id));
      el.value.textContent=state?.values[id] || '';
    }
    for (const [id,button] of edgeButtons) {
      button.setAttribute('aria-expanded',String(selectedEdge===id));
      button.setAttribute('aria-pressed',String(active.has(id)));
    }
    detail.replaceChildren();
    const node=byId.get(selected), edge=data.edges.find(e=>e.id===selectedEdge);
    if (node) {
      paragraph(node.label);
      if(node.detail) paragraph(node.detail);
      if(state?.values[selected]) paragraph(state.label+'：'+state.values[selected]);
      for(const e of (showMechanism?data.edges.filter(e=>e.from===selected || e.to===selected):[])) {
        paragraph(byId.get(e.from).label+' → '+e.label+' → '+byId.get(e.to).label);
      }
    } else if (edge) paragraph(byId.get(edge.from).label+' → '+edge.label+' → '+byId.get(edge.to).label);
    detail.hidden=!(node || edge);
    root.querySelector('[data-step-controls]').hidden=data.states.length<2;
    root.querySelector('[data-step-label]').textContent=state?`${step+1}/${data.states.length} · ${state.label}`:'';
    stepNote.textContent=state?.values[state.id] || '';
    stepNote.hidden=!stepNote.textContent;
    root.querySelector('[data-prev]').disabled=step===0;
    root.querySelector('[data-next]').disabled=step>=data.states.length-1;
    draw();
  }
  function save() {
    const host=window.openai;
    if(host?.setWidgetState) Promise.resolve(host.setWidgetState({
      modelContent:{identity:data.identity,selected,selectedEdge,step,interaction_is_not_learning_evidence:true},
      privateContent:{key:root.id,selected,selectedEdge,step}
    })).catch(()=>{});
  }
  function restore(saved) {
    const value=saved?.privateContent;
    if(value?.key!==root.id) return;
    selected=byId.has(value.selected)?value.selected:null;
    selectedEdge=!selected && data.edges.some(e=>e.id===value.selectedEdge)?value.selectedEdge:null;
    step=Number.isInteger(value.step)?Math.max(0,Math.min(value.step,Math.max(0,data.states.length-1))):step;
    update();
  }
  function showStep(index) {
    step=Math.max(0,Math.min(data.states.length-1,index));
    selected=null;
    selectedEdge=null;
    update();
    save();
  }
  root.querySelector('[data-prev]').addEventListener('click',()=>showStep(step-1));
  root.querySelector('[data-next]').addEventListener('click',()=>showStep(step+1));
  update(); restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
  if(showMechanism) new ResizeObserver(draw).observe(diagram);
})();
</script>
